name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region
        required: false
        default: eastus
      prefix:
        description: Resource name prefix (lowercase, no special chars)
        required: false
        default: aria

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_LOCATION: ${{ github.event.inputs.location || 'eastus' }}
      PREFIX: ${{ github.event.inputs.prefix || 'aria' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure resources (RG, ACR, Foundry, AI Search, Key Vault, App Service, SWA)
        run: bash scripts/deploy_azure.sh
        env:
          LOCATION: ${{ env.AZURE_LOCATION }}
          PREFIX: ${{ env.PREFIX }}

      - name: Build and push backend image to ACR
        run: |
          ACR="${PREFIX}acr"
          az acr build -r "$ACR" -t aria-backend:latest backend

      - name: Build frontend and deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_API_TOKEN }}
          app_location: "frontend"
          output_location: "dist"
